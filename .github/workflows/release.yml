name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: '发布为 GitHub Release'
        required: false
        type: boolean
        default: false
      tag_name:
        description: 'Release 版本标签（如 v1.0.0）'
        required: false
        type: string
        default: ''

permissions:
  contents: write

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyside6 mutagen pycryptodome httpx pyinstaller

      - name: Build Windows Executable
        run: |
          python scripts/build.py

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NCMTagExtractor-Windows-x86_64
          path: dist/NCMTagExtractor-Windows-x86_64.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies & appimagetool
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyside6 mutagen pycryptodome httpx pyinstaller

      - name: Build Linux AppImage
        run: |
          python scripts/build.py

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NCMTagExtractor-Linux-x86_64
          path: dist/NCMTagExtractor-Linux-x86_64.AppImage

  publish-release:
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release && inputs.tag_name != '')
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: NCMTagExtractor-Windows-x86_64

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: NCMTagExtractor-Linux-x86_64

      - name: Create Windows Zip Package
        run: |
          zip -j NCMTagExtractor-Windows-x86_64.zip NCMTagExtractor-Windows-x86_64.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name != '' && inputs.tag_name || github.ref_name }}
          files: |
            NCMTagExtractor-Windows-x86_64.exe
            NCMTagExtractor-Windows-x86_64.zip
            NCMTagExtractor-Linux-x86_64.AppImage
          generate_release_notes: true
