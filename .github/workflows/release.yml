name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyside6 mutagen pycryptodome httpx pyinstaller

      - name: Build Windows Executable
        run: |
          python scripts/build.py
          Move-Item dist/NCMTagExtractor.exe dist/NCMTagExtractor-Windows.exe

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NCMTagExtractor-Windows
          path: dist/NCMTagExtractor-Windows.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies & appimagetool
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyside6 mutagen pycryptodome httpx pyinstaller

      - name: Build Linux AppImage
        run: |
          python scripts/build.py

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NCMTagExtractor-Linux
          path: dist/NCMTagExtractor-x86_64.AppImage

  publish-release:
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: NCMTagExtractor-Windows

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: NCMTagExtractor-Linux

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            NCMTagExtractor-Windows.exe
            NCMTagExtractor-x86_64.AppImage
          generate_release_notes: true
