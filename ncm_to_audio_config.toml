# 输入目录，可以写多个。
# 相对路径会按这个配置文件所在目录解释，"." 就是当前脚本目录。
# Windows 路径建议用单引号，例如 'D:\CloudMusic'，这样反斜杠不需要转义。
input_dirs = [
  ".",
  # 'D:\CloudMusic',
  # 'D:\CloudMusic\VipSongsDownload',
]

# 输出目录。默认 '.' 表示输出到当前脚本目录。
output_dir = '.'

# 是否递归搜索子目录。
recursive = false

# 处理顺序：
# "name" 按文件名排序
# "mtime" 按修改时间从旧到新
# "mtime_desc" 按修改时间从新到旧
sort_by = "name"

# 只处理修改时间晚于这个时间的文件。
# 留空表示不跳过旧文件；也可以手动写成 "2026-05-19 22:40:33.55"。
process_after_mtime = ""

# 如果 sort_by = "mtime"，并且这个值为 true，
# 每次处理成功后会自动把 process_after_mtime 推进到最新成功文件的修改时间。
auto_update_process_after_mtime = true

# 是否开启“只处理上次失败的文件”。
# 如果为 true，且同目录下存在 failed_list.txt，下一次运行将只加载并处理该文件中列出的失败文件。
only_process_failed = false
